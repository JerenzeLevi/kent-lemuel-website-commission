<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Something I want to ask you..." />
    <meta name="theme-color" content="#f7b6cf" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E" />
    <title>For you &lt;3</title>
  </head>
  <body>
    <canvas class="petals" id="petals" aria-hidden="true"></canvas>

    <main class="app">
      <section class="card" aria-live="polite">
        <!-- ============ 1. INITIAL PROPOSAL ============ -->
        <div class="screen" id="screen-proposal">
          <div class="cat-frame">
            <img id="cat" class="cat" alt="A cat" />
            <div class="cat-fallback" id="cat-fallback" hidden aria-hidden="true">🐱</div>
          </div>
          <p class="kicker" id="kicker"></p>
          <h1 class="question" id="question"></h1>

          <!-- The stage is the defined area the NO button may move within -->
          <div class="stage" id="stage">
            <button type="button" class="btn btn-yes" id="yes-btn"></button>
            <button type="button" class="btn btn-no" id="no-btn"></button>
          </div>
        </div>

        <!-- ============ 2. PATIENCE (after 4 NO activations) ============ -->
        <div class="screen" id="screen-patience" hidden>
          <div class="cat-frame cat-frame-sm">
            <img id="cat-patience" class="cat" alt="A cat" />
            <div class="cat-fallback" hidden aria-hidden="true">🐱</div>
          </div>
          <p class="patience-message" id="patience-message"></p>
          <button type="button" class="link-btn" id="patience-back">← Back to the question</button>
        </div>

        <!-- ============ 3. ACCEPTED / CELEBRATION ============ -->
        <div class="screen" id="screen-accepted" hidden>
          <div class="cat-frame cat-frame-sm">
            <img id="cat-yes" class="cat" alt="A happy cat" />
            <div class="cat-fallback" hidden aria-hidden="true">😻</div>
          </div>
          <h2 class="celebration-heading" id="celebration-heading"></h2>
          <p class="celebration-sub" id="celebration-sub"></p>

          <nav class="action-row" aria-label="Surprises">
            <button type="button" class="action-btn" data-open="gallery">
              <span class="action-icon" aria-hidden="true">
                <!-- image icon -->
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
              </span>
              <span class="action-title">Our Moments</span>
              <span class="action-desc">Photos of us</span>
            </button>
            <button type="button" class="action-btn" data-open="letter">
              <span class="action-icon" aria-hidden="true">
                <!-- envelope icon -->
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              </span>
              <span class="action-title">A Letter for You</span>
              <span class="action-desc">Read it slowly</span>
            </button>
            <button type="button" class="action-btn" data-open="gift">
              <span class="action-icon" aria-hidden="true">
                <!-- gift icon -->
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8c-1.5-3-5-3-5-1s3.5 1 5 1zm0 0c1.5-3 5-3 5-1s-3.5 1-5 1z"/></svg>
              </span>
              <span class="action-title">A Little Gift</span>
              <span class="action-desc">Open me</span>
            </button>
          </nav>
        </div>
      </section>
    </main>

    <!-- ============ MODAL (gallery / letter / gift share one shell) ============ -->
    <div class="modal" id="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" id="modal-panel">
        <header class="modal-header">
          <h2 id="modal-title"></h2>
          <button type="button" class="icon-btn" id="modal-close" aria-label="Close">✕</button>
        </header>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
